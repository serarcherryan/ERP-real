name: Bug
description: ERP bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: dev / test / staging / production
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, traceId, screenshots, screen recordings.

