name: Tech Debt
description: Engineering improvement or refactor
title: "[Tech Debt]: "
labels: ["tech-debt"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is the current technical problem?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Why does this matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How will we know the improvement worked?

