services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-real-postgres-dev
    environment:
      POSTGRES_DB: erp_real
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_password
    ports:
      - "5432:5432"
    volumes:
      - erp-real-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_real"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../../apps/backend
    container_name: erp-real-backend-dev
    profiles: ["backend"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/erp_real
      SPRING_DATASOURCE_USERNAME: erp
      SPRING_DATASOURCE_PASSWORD: erp_dev_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  erp-real-postgres-data:
